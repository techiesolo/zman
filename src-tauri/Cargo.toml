[workspace]
members = [".", "core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[package]
name = "zman"
description = "Local-only API client. No cloud, no sync."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "zman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zman-core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "fs"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
